<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заказ номенклатуры</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <h1 class="header__title">Заказ</h1>
      <div class="header__actions">
        <div class="font-scale" role="group" aria-label="Масштаб интерфейса">
          <button type="button" id="scale-down" class="btn btn-ghost btn-icon" aria-label="Уменьшить">A−</button>
          <span id="scale-value" class="font-scale__value">120%</span>
          <button type="button" id="scale-up" class="btn btn-ghost btn-icon" aria-label="Увеличить">A+</button>
        </div>
        <button type="button" id="export-btn" class="btn btn-ghost">Excel</button>
        <button type="button" id="cart-btn" class="btn btn-secondary cart-btn">
          Корзина <span id="cart-badge" class="badge hidden">0</span>
        </button>
      </div>
    </header>
    <main id="main" class="main"></main>
    <div id="toast" class="toast hidden" role="status"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
